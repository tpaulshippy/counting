name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      - name: Lint code
        run: bundle exec rubocop -f github

      - name: Run tests
        env:
          RAILS_ENV: test
        run: |
          bin/rails db:prepare
          bin/rails test

  rn:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: counting-rn

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: counting-rn/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke-build iOS bundle
        run: npx expo export --platform ios --output-dir dist --clear
